<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f4f8;
            color: #222;
        }

        header {
            text-align: center;
            padding: 30px 15px;
            background: #1e293b;
            color: white;
        }

        header h1 {
            margin-bottom: 10px;
        }

        .filters {
            text-align: center;
            margin: 25px;
        }

        .filters button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 20px;
            background: #334155;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .filters button:hover {
            background: #0ea5e9;
            transform: scale(1.05);
        }

        .gallery {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 15px;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: 0.3s;
        }

        .gallery-item:hover {
            transform: translateY(-8px);
        }

        .gallery-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            transition: 0.4s;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .lightbox img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 10px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: white;
            font-size: 45px;
            cursor: pointer;
        }

        .prev,
        .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            border: none;
            padding: 12px 18px;
            font-size: 25px;
            cursor: pointer;
            border-radius: 50%;
        }

        .prev {
            left: 30px;
        }

        .next {
            right: 30px;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .lightbox img {
                max-width: 90%;
            }

            .prev {
                left: 10px;
            }

            .next {
                right: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📸 My Image Gallery</h1>
    <p>Explore beautiful images</p>
</header>

<div class="filters">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('city')">City</button>
    <button onclick="filterImages('animals')">Animals</button>
</div>

<div class="gallery">

    <div class="gallery-item nature">
        <img src="https://picsum.photos/id/1018/600/400" onclick="openLightbox(0)">
    </div>

    <div class="gallery-item city">
        <img src="https://picsum.photos/id/1011/600/400" onclick="openLightbox(1)">
    </div>

    <div class="gallery-item animals">
        <img src="https://picsum.photos/id/1025/600/400" onclick="openLightbox(2)">
    </div>

    <div class="gallery-item nature">
        <img src="https://picsum.photos/id/1039/600/400" onclick="openLightbox(3)">
    </div>

    <div class="gallery-item city">
        <img src="https://picsum.photos/id/1043/600/400" onclick="openLightbox(4)">
    </div>

    <div class="gallery-item animals">
        <img src="https://picsum.photos/id/237/600/400" onclick="openLightbox(5)">
    </div>

</div>

<!-- Lightbox -->

<div class="lightbox" id="lightbox">

    <span class="close" onclick="closeLightbox()">&times;</span>

    <button class="prev" onclick="changeImage(-1)">❮</button>

    <img id="lightboxImage">

    <button class="next" onclick="changeImage(1)">❯</button>

</div>

<script>

    const images = [
        "https://picsum.photos/id/1018/600/400",
        "https://picsum.photos/id/1011/600/400",
        "https://picsum.photos/id/1025/600/400",
        "https://picsum.photos/id/1039/600/400",
        "https://picsum.photos/id/1043/600/400",
        "https://picsum.photos/id/237/600/400"
    ];

    let currentImage = 0;

    function openLightbox(index) {
        currentImage = index;

        document.getElementById("lightboxImage").src =
            images[currentImage];

        document.getElementById("lightbox").style.display = "flex";
    }

    function closeLightbox() {
        document.getElementById("lightbox").style.display = "none";
    }

    function changeImage(direction) {

        currentImage += direction;

        if (currentImage < 0) {
            currentImage = images.length - 1;
        }

        if (currentImage >= images.length) {
            currentImage = 0;
        }

        document.getElementById("lightboxImage").src =
            images[currentImage];
    }

    function filterImages(category) {

        const items = document.querySelectorAll(".gallery-item");

        items.forEach(item => {

            if (category === "all" ||
                item.classList.contains(category)) {

                item.style.display = "block";

            } else {

                item.style.display = "none";

            }
        });
    }

</script>

</body>
</html>
